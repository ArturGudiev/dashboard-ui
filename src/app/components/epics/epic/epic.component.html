<mat-spinner *ngIf="isLoading"></mat-spinner>
<ng-container *ngIf="!isLoading">
  <app-task-container
    [taskContainer]="epic"
    [parentsPath]="parentsPath"
    [refreshTasks$]="refreshSubtasks$"
    [refreshProblems$]="refreshProblemsList$"
    [refreshQuestions$]="refreshQuestionsList$"
    [showEpics]="true"
    [showStories]="true"
    (refreshTaskContainer)="refreshEpic()"
  ></app-task-container>
</ng-container>
