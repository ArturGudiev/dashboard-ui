<mat-card   id="command-card">
  <form autocomplete="on" [formGroup]="myForm" (ngSubmit)="onSubmit()">
    <mat-form-field id="nav-input-field">
      <mat-label>Command</mat-label>
      <input id="description-input"  matInput formControlName="command" autofocus
             (focusout)="focusOutFunction()">
    </mat-form-field>

    <mat-card-actions>
      <button mat-button [disabled]="!myForm.valid" type="submit">OK</button>
      <button mat-button (click)="onNoClick()">CANCEL</button>
    </mat-card-actions>
  </form>

</mat-card>
