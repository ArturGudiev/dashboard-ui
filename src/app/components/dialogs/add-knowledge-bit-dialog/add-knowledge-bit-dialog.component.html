<form autocomplete="on" [formGroup]="myForm" (ngSubmit)="onSubmit()">
  <h2>Add knowledge bit</h2>

  <mat-form-field appearance="fill">
    <mat-label>Name</mat-label>
    <input #nameInput matInput formControlName="name" type="text">
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Extension (optional)</mat-label>
    <input matInput formControlName="extension" type="text">
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Value</mat-label>
    <textarea
      matInput
      formControlName="value"
      cdkTextareaAutosize
      cdkAutosizeMinRows="4"
      cdkAutosizeMaxRows="10"
    ></textarea>
  </mat-form-field>

  <div mat-dialog-actions>
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-button type="submit" [disabled]="myForm.invalid">Add</button>
  </div>
</form>
