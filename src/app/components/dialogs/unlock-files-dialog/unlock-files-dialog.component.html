<h2 mat-dialog-title>Enter files key</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <p class="hint">
      Files on this server are encrypted at rest. Enter the rclone crypt password and salt.
      The key stays in this browser tab only and is never sent to the server.
    </p>
    <mat-form-field appearance="fill" class="full">
      <mat-label>Password</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="off" />
    </mat-form-field>
    <mat-form-field appearance="fill" class="full">
      <mat-label>Salt</mat-label>
      <input matInput type="password" formControlName="salt" autocomplete="off" />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="!form.valid">Unlock</button>
  </mat-dialog-actions>
</form>
