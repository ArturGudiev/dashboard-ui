<div class="select-multiple-dialog">
  <h2>{{ data.title }}</h2>

  <div class="toolbar">
    <mat-checkbox
      [checked]="allSelected()"
      [indeterminate]="someSelected()"
      (change)="toggleAll()"
    >
      Select all
    </mat-checkbox>
    <span class="selected-count">{{ selectedCount() }} selected</span>
  </div>

  <div class="items-list" role="listbox" aria-multiselectable="true">
    @for (item of data.values; track $index) {
      <div
        class="item-row"
        role="option"
        [attr.aria-selected]="isSelected($index)"
        [class.selected]="isSelected($index)"
        (click)="toggleIndex($index)"
      >
        <mat-checkbox
          [checked]="isSelected($index)"
          (click)="$event.stopPropagation()"
          (change)="toggleIndex($index)"
        ></mat-checkbox>
        <span class="item-label">{{ $index + 1 }}. {{ labelFor(item) }}</span>
      </div>
    }
  </div>

  <div mat-dialog-actions>
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button
      mat-flat-button
      color="primary"
      type="button"
      (click)="onOk()"
      [disabled]="selectedCount() === 0"
    >
      Ok
    </button>
  </div>
</div>
