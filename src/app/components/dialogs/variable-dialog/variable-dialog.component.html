<form autocomplete="on" (submit)="onSubmit($event)">
  <h2>{{ title() }}</h2>

  <mat-form-field appearance="fill">
    <mat-label>Variable name</mat-label>
    <input matInput [formField]="variableForm.variableName" type="text">
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Variable value</mat-label>
    <input matInput [formField]="variableForm.variableValue" type="text">
  </mat-form-field>

  <div mat-dialog-actions>
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-button type="submit" [disabled]="!isFormValid()">Save</button>
  </div>
</form>
