<div id="direction-stats-wrapper">
  <div class="stats-header">
    <button mat-mini-fab color="accent" type="button" (click)="goBack()" aria-label="Back to direction">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1>{{ direction().getFullDescription() }} — stats</h1>
  </div>

  @if (stats().length > 0) {
    <table mat-table [dataSource]="stats()" class="mat-elevation-z2 stats-table">
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let entry">
          {{ entry.date | date: 'yyyy-MM-dd HH:mm' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="text">
        <th mat-header-cell *matHeaderCellDef>Entry</th>
        <td mat-cell *matCellDef="let entry">{{ entry.text }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  } @else {
    <p>No stats yet.</p>
  }
</div>
