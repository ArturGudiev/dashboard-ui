<mat-toolbar color="primary">

  <button mat-button class="sidenav-toggle" (click)="toggleSidenav.emit()">
    <mat-icon>menu</mat-icon>
  </button>

  <div class="toolbar-nav toolbar-nav-desktop">
    <span class="app-name">Task Manager vGo</span>
    <button id="task-button" class="toolbar-nav-button" mat-stroked-button (click)="onNavToClick()">Navigate</button>
    <button class="toolbar-nav-button" mat-stroked-button (click)="onEpicsClick()">Epics</button>
    <button class="toolbar-nav-button" mat-stroked-button (click)="onLogsClick()">Logs</button>
    <button class="toolbar-nav-button" mat-stroked-button (click)="onDirectionsClick()">Directions</button>
    <button class="toolbar-nav-button" mat-stroked-button (click)="onLongTasksClick()">Long Tasks</button>
    <button class="toolbar-nav-button" mat-stroked-button (click)="onStatesClick()">States</button>
    <button class="toolbar-nav-button" mat-stroked-button (click)="onDueDateTasksClick()">Due date</button>
    <button class="toolbar-nav-button" mat-stroked-button (click)="onKnowledgeNodesClick()">Knowledge Nodes</button>
    <button class="toolbar-nav-button" mat-stroked-button (click)="onFilesClick()">Files</button>
  </div>

  <button
    mat-icon-button
    class="toolbar-nav-menu-button"
    [matMenuTriggerFor]="navMenu"
    aria-label="Open navigation menu"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <mat-menu #navMenu="matMenu" class="toolbar-nav-menu">
    <div class="toolbar-nav-menu-title" disabled mat-menu-item>Task Manager vGo</div>
    @if (currentUser(); as user) {
      <div class="toolbar-nav-menu-user" disabled mat-menu-item>{{ user.name }}</div>
    }
    <button mat-menu-item (click)="onNavToClick()">Navigate</button>
    <button mat-menu-item (click)="onLogsClick()">Logs</button>
    <button mat-menu-item (click)="onDirectionsClick()">Directions</button>
    <button mat-menu-item (click)="onLongTasksClick()">Long Tasks</button>
    <button mat-menu-item (click)="onEpicsClick()">Epics</button>
    <button mat-menu-item (click)="onStatesClick()">States</button>
    <button mat-menu-item (click)="onDueDateTasksClick()">Due date</button>
    <button mat-menu-item (click)="onKnowledgeNodesClick()">Knowledge Nodes</button>
    <button mat-menu-item (click)="onFilesClick()">Files</button>
  </mat-menu>

  <span class="example-spacer"></span>

  @if(showUntilValue()) {
    <button
      type="button"
      class="toolbar-interactive"
      style="margin-right: 3rem"
      (click)="onUntilValueClick()"
      [class.shining-text]="doneTasks() >= doneTasksUntilValue()"
      [style.color]="doneTasks() >= doneTasksUntilValue() ? 'red' : undefined"
    >
      {{doneTasksUntilValue()}}
    </button>
  }
  <button
    type="button"
    id="doneTasksButton"
    class="toolbar-interactive"
    (click)="openGetDatetimeDialog()"
  >{{doneTasks()}}</button>

  <button
    mat-stroked-button
    id="logout-button"
    class="logout-button"
    (click)="onLogoutClick()"
    aria-label="Logout"
  >
    <mat-icon>logout</mat-icon>
    @if (currentUser(); as user) {
      <span class="logout-label">{{ user.name }}</span>
    } @else {
      <span class="logout-label">Logout</span>
    }
  </button>

</mat-toolbar>
