<div id="due-date-tasks-page" class="mt-3 ms-4">
  <div class="page-header">
    <div class="text-xl">Tasks by due date</div>
    <button
      id="add-global-task-button"
      mat-mini-fab
      color="primary"
      type="button"
      (click)="addGlobalTask()"
      aria-label="Add global task"
    >
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <mat-form-field appearance="fill" class="date-field">
    <mat-label>Due date</mat-label>
    <input matInput type="date" [formControl]="dateControl">
  </mat-form-field>

  @if (tasks().length > 0) {
    <table mat-table [dataSource]="tasks()" class="mat-elevation-z8 tasks-table">
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td
          mat-cell
          class="row-link"
          tabindex="0"
          role="button"
          *matCellDef="let task"
          (click)="onTaskClick(task)"
          (keydown.enter)="onTaskClick(task)"
          (keydown.space)="onTaskClick(task); $event.preventDefault()"
        >
          {{ task.getFullDescription() }}
        </td>
      </ng-container>

      <ng-container matColumnDef="dueDateTime">
        <th mat-header-cell *matHeaderCellDef>Due date</th>
        <td mat-cell *matCellDef="let task">
          {{ task.dueDateTime ? (task.dueDateTime | date: 'yyyy-MM-dd':'UTC') : '—' }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  } @else {
    <p>No open tasks for this date.</p>
  }
</div>
