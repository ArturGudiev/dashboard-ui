<div class="scripts-header">
  <h1>Scripts</h1>
  <button mat-mini-fab color="primary" (click)="createScript()" aria-label="Add script">
    <mat-icon>add</mat-icon>
  </button>
</div>

@if (scripts().length === 0) {
  <p class="empty">No scripts yet. Create one to automate container actions.</p>
} @else {
  <table mat-table [dataSource]="scripts()" class="scripts-table mat-elevation-z2">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let row">{{ row.name }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let row">{{ row.description }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button (click)="editScript(row)" aria-label="Edit script">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button (click)="deleteScript(row)" aria-label="Delete script">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
}
