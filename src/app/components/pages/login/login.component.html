<div class="login-page">
  <form class="login-card" (submit)="onSubmit($event)">
    <h1>Sign in</h1>

    <mat-form-field>
      <mat-label>Email</mat-label>
      <input matInput type="email" [formField]="loginForm.email" autocomplete="username">
    </mat-form-field>

    <mat-form-field>
      <mat-label>Password</mat-label>
      <input matInput type="password" [formField]="loginForm.password" autocomplete="current-password">
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in...' : 'Sign in' }}
    </button>
  </form>
</div>
