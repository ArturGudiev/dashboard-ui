
<div style="display: flex; align-items: baseline; margin-bottom: 1rem">
    <div>{{taskContainer.getFullDescription()}}</div>
    <button
        mat-icon-button
        (click)="remoteItem.emit()"

    >
        <mat-icon>clear</mat-icon>
    </button>
</div>
<app-tasks-list
  [container]="taskContainer"
  [showTitle]="true"
  [tasks]="tasks"
  [level]="0"
  (refreshTasks)="refreshTasks()"
>
</app-tasks-list>
