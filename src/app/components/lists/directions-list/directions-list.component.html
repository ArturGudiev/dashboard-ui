<div id="directions-actions" class="flex items-center mt-3">
  <div id="directions-title" class="text-xl">Directions</div>
  <button
    id="add-direction-button"
    class="ms-4"
    mat-mini-fab
    color="primary"
    (click)="addDirection()"
  >
    <mat-icon>add</mat-icon>
  </button>
</div>

@if (directions().length > 0) {
  <div id="table-wrapper">
    <table
      id="directions-table"
      mat-table
      [dataSource]="dataSource"
      class="mat-elevation-z8"
    >
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef>
          <div style="display: flex; align-items: center">
            <mat-checkbox></mat-checkbox>
            <span style="margin-left: 1rem">No.</span>
          </div>
        </th>
        <td mat-cell *matCellDef="let row; let i = index">
          <div style="display: flex; align-items: center">
            <mat-checkbox
              (click)="$event.stopPropagation()"
              (change)="$event ? selection.toggle(row) : null"
              [checked]="selection.isSelected(row)"
            ></mat-checkbox>
            <span style="margin-left: 1rem">
              {{ i + 1 + (paginator ? paginator.pageIndex * paginator.pageSize : 0) }}
            </span>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td
          mat-cell
          class="row-link"
          tabindex="0"
          role="button"
          *matCellDef="let direction"
          (click)="onDirectionClick(direction)"
          (keydown.enter)="onDirectionClick(direction)"
          (keydown.space)="onDirectionClick(direction); $event.preventDefault()"
        >
          <span>{{ direction.description }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="closed">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let direction">
          <span>{{ direction.closed ? 'closed' : 'open' }}</span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      id="directions-paginator"
      [pageSize]="15"
      [pageSizeOptions]="[10, 15, 20]"
      showFirstLastButtons
      aria-label="Select page of directions"
    ></mat-paginator>
  </div>
}
