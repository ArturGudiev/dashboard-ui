@if(repetitiveTasks().length > 0) {
<div id="repetitive-tasks-actions" class="flex items-center mt-3">
  <div id="repetitive-tasks-title" class="text-xl">Repetitive tasks</div>

  <!-- Иконка плюса для добавления задачи -->
  <button
    id="add-task-button"
    class="ms-4"
    mat-mini-fab
    color="primary"
    (click)="addRepetitiveTask()"
  >
    <mat-icon class="tasks-icon">add</mat-icon>
  </button>
</div>

  <div id="table-wrapper">
    <table
      id="repetitive-tasks-table"
      mat-table [dataSource]="dataSource"
      class="mat-elevation-z8">

      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef>
          <div style="display: flex; align-items: center">
            <mat-checkbox></mat-checkbox>
            <span style="margin-left: 1rem">No.</span>
          </div>
        </th>
        <td mat-cell *matCellDef="let row; let i=index">
          <div style="display: flex; align-items: center">
            <mat-checkbox
              (click)="$event.stopPropagation()"
              (change)="$event ? selection.toggle(row) : null"
              [checked]="selection.isSelected(row)"
            ></mat-checkbox>
            <span
              style="margin-left: 1rem">{{ i + 1 + (paginator ? paginator.pageIndex * paginator.pageSize : 0) }}</span>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef> Description</th>
        <td
          mat-cell
          class="row-link"
          tabindex="0"
          role="button"
          *matCellDef="let repetitiveTask"
          (click)="onRepetitiveTaskClick(repetitiveTask)"
          (keydown.enter)="onRepetitiveTaskClick(repetitiveTask)"
          (keydown.space)="onRepetitiveTaskClick(repetitiveTask); $event.preventDefault()"
        >
          <span>{{ repetitiveTask.description }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Actions
        </th>
        <td
          mat-cell
          *matCellDef="let subtask; let i=index"
          id="row-{{i}}"
          class="row-link"

        >
<!--          [ngClass]="{'highlight': selection.selected.includes(subtask.id)}"-->
          <mat-icon (click)="finishRepetitiveTask(subtask)">done</mat-icon>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator
      id="repetitive-tasks-paginator"
      [pageSize]="15"
      [pageSizeOptions]="[10, 15, 20]"
      showFirstLastButtons
      aria-label="Select page of periodic elements">
    </mat-paginator>

  </div>

}
