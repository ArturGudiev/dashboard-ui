<div class="checks-header">
  <div class="checks-title">Checks</div>
  @if (showAddButton()) {
    <button
      class="add-check-button"
      mat-mini-fab
      color="primary"
      (click)="addCheck.emit()"
      aria-label="Add check"
    >
      <mat-icon>add</mat-icon>
    </button>
  }
</div>

@if (checks().length > 0) {
  <table mat-table [dataSource]="checks()" class="mat-elevation-z2 checks-table">
    <ng-container matColumnDef="dateTime">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let check">
        {{ check.date_time | date: 'yyyy-MM-dd HH:mm' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="isFulfilled">
      <th mat-header-cell *matHeaderCellDef>Fulfilled</th>
      <td mat-cell *matCellDef="let check">
        <app-fulfilled-status-icon [isFulfilled]="check.is_fulfilled" />
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
} @else {
  <p>No checks yet.</p>
}
