<!--Иконки "Добавления вопросы" -->
@if (questions().length > 0) {
  <div id="questions-actions">
    <h2 id="questions-title" class="red-color">Questions</h2>
    <!-- Иконка плюса для добавления вопросы -->
    <button mat-mini-fab color="primary" id="add-question-button" (click)="addQuestion()">
      <mat-icon class="questions-icon">add</mat-icon>
    </button>
    <!-- Иконка завершения вопросы -->
    <!--    <button mat-mini-fab color="primary" [disabled]="!this.selection.hasValue()"-->
    <!--            (click)="onFinishQuestionClick()">-->
    <!--      <mat-icon class="questions-icon">done</mat-icon>-->
  <!--    </button>-->
</div>
<div id="table-wrapper">
  @if (questions().length > 0) {
    <table
      id="questions-table"
      mat-table
      [dataSource]="questions()"
      class="mat-elevation-z8"
      >
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef>
          <mat-checkbox
            class="red-color"
            [disabled]="true"
            (change)="$event ? onMainCheckboxClick() : null"
            [checked]="selection.hasValue() && isAllSelected()"
            [indeterminate]="selection.hasValue() && !isAllSelected()"
            >
          </mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let row">
          <mat-checkbox (click)="$event.stopPropagation()"
            (change)="$event ? selection.toggle(row) : null"
            [checked]="selection.isSelected(row)">
          </mat-checkbox>
        </td>
      </ng-container>
      <!-- Position Column -->
      <ng-container matColumnDef="position">
        <th mat-header-cell *matHeaderCellDef> No.</th>
        <td
          mat-cell
          class="row-link red-color"
          tabindex="0"
          role="button"
          *matCellDef="let question; let i = index"
          (click)="onQuestionClick(question)"
          (keydown.enter)="onQuestionClick(question)"
          (keydown.space)="onQuestionClick(question); $event.preventDefault()"
        >
          <span>{{ i + 1 }}</span>
        </td>
      </ng-container>
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef> Description</th>
        <td
          mat-cell
          class="row-link red-color"
          tabindex="0"
          role="button"
          *matCellDef="let question"
          (click)="onQuestionClick(question)"
          (keydown.enter)="onQuestionClick(question)"
          (keydown.space)="onQuestionClick(question); $event.preventDefault()"
        >
          <span>{{ question.description }}</span>
        </td>
      </ng-container>
      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions</th>
        <td mat-cell *matCellDef="let question; let i=index" id="row-{{i}}">
          <mat-icon (click)="onAnswerQuestionClick(question)">done</mat-icon>
        </td>
      </ng-container>
      <!-- Чекбокс для отображенмя подзадач -->
      <ng-container matColumnDef="showSubtasks">
        <th mat-header-cell *matHeaderCellDef>Subtasks</th>
        <td
          mat-cell
          *matCellDef="let question; let i=index"
          id="row-{{i}}"
          class="row-link"
          [ngClass]="{'highlight': selection.selected.includes(question._id)}"
          >
          <mat-checkbox
            [checked]="checkedElement(question)"
            (change)="setShowSubtasksField($event, question)"
            >
          </mat-checkbox>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  }
  <!-- Список списков подзадач соотетствующий выбранным (для отображения подзадач) задачам -->
  <div id="subtasks-of-selected-tasks">
    @for (item of tasksByIdMapKeys(); track item) {
      <app-tasks-list
        [container]="expandedSubtasks()[item].container"
        [tasks]="expandedSubtasks()[item].tasks"
        [variables]="expandedSubtasks()[item].container.variables"
        (refreshTasks)="refreshTasksOfSelectedQuestion(item)"
        [showTitle]="true"
        [level]="1"
        >
      </app-tasks-list>
    }
  </div>
</div>
}
