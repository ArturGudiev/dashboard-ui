@if (!tableVisible()) {
  <div id="variables-collapsed">
    <div class="toggle-button-wrapper">
      <button
        mat-mini-fab
        color="primary"
        id="toggle-variables-table-button"
        type="button"
        [attr.aria-label]="toggleTableTitle()"
        (click)="toggleTable()"
      >
        <mat-icon>visibility</mat-icon>
      </button>
      <span class="variables-count-badge">{{ variables().length }}</span>
    </div>
  </div>
} @else {
  <div id="variables-actions">
    <h2 id="variables-title">Variables</h2>

    <button
      mat-mini-fab
      color="primary"
      id="add-variable-button"
      type="button"
      (click)="onAddVariableClick()"
    >
      <mat-icon>add</mat-icon>
    </button>

    <button
      mat-mini-fab
      color="primary"
      id="hide-variables-table-button"
      type="button"
      [attr.aria-label]="toggleTableTitle()"
      (click)="toggleTable()"
    >
      <mat-icon>visibility_off</mat-icon>
    </button>
  </div>

  <div id="table-wrapper">
    <table
      id="variables-table"
      mat-table
      [dataSource]="variables()"
      class="mat-elevation-z8"
    >
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let variable" class="row-link">{{ variable.variableName }}</td>
      </ng-container>

      <ng-container matColumnDef="value">
        <th mat-header-cell *matHeaderCellDef>Value</th>
        <td mat-cell *matCellDef="let variable" class="row-link">{{ variable.variableValue }}</td>
      </ng-container>

      <ng-container matColumnDef="delete">
        <th mat-header-cell *matHeaderCellDef>Delete</th>
        <td mat-cell *matCellDef="let variable">
          <mat-icon (click)="onDeleteVariable(variable, $event)">delete</mat-icon>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns;"
        class="row-link"
        (click)="onEditVariable(row)"
      ></tr>
    </table>
  </div>
}
