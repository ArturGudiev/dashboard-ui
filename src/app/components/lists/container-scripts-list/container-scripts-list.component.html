<div id="scripts-actions">
  <h2 id="scripts-title">Scripts</h2>

  <button
    mat-mini-fab
    color="primary"
    id="add-script-button"
    type="button"
    aria-label="Add script"
    (click)="onAddScriptClick()"
  >
    <mat-icon>add</mat-icon>
  </button>
</div>

@if (scripts().length > 0) {
  <div id="scripts-table-wrapper">
    <table
      id="scripts-table"
      mat-table
      [dataSource]="scripts()"
      class="mat-elevation-z8"
    >
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let script" class="row-link">{{ script.name }}</td>
      </ng-container>

      <ng-container matColumnDef="delete">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let script">
          <mat-icon (click)="onDeleteScript(script, $event)">delete</mat-icon>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns;"
        class="row-link"
        (click)="onScriptClick(row)"
      ></tr>
    </table>
  </div>
}
