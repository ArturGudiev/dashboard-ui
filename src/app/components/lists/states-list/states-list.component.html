@if (showTitle()) {
  <div id="states-actions" class="flex items-center mt-3">
    <div id="states-title" class="text-xl">{{ title() }}</div>
    @if (showAddButton()) {
      <button
        id="add-state-button"
        class="ms-4"
        mat-mini-fab
        color="primary"
        (click)="addState()"
      >
        <mat-icon>add</mat-icon>
      </button>
    }
  </div>
}

@if (states().length > 0) {
  <div id="table-wrapper">
    <table
      id="states-table"
      mat-table
      [dataSource]="dataSource"
      class="mat-elevation-z8"
    >
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef>
          <div style="display: flex; align-items: center">
            <mat-checkbox></mat-checkbox>
            <span style="margin-left: 1rem">No.</span>
          </div>
        </th>
        <td mat-cell *matCellDef="let row; let i = index">
          <div style="display: flex; align-items: center">
            <mat-checkbox
              (click)="$event.stopPropagation()"
              (change)="$event ? selection.toggle(row) : null"
              [checked]="selection.isSelected(row)"
            ></mat-checkbox>
            <span style="margin-left: 1rem">
              {{ i + 1 + (paginator ? paginator.pageIndex * paginator.pageSize : 0) }}
            </span>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td
          mat-cell
          class="row-link"
          tabindex="0"
          role="button"
          *matCellDef="let state"
          (click)="onStateClick(state)"
          (keydown.enter)="onStateClick(state)"
          (keydown.space)="onStateClick(state); $event.preventDefault()"
        >
          <span>{{ state.description }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="isFulfilled">
        <th mat-header-cell *matHeaderCellDef>Fulfilled</th>
        <td mat-cell *matCellDef="let state">
          <app-fulfilled-status-icon [isFulfilled]="state.isFulfilled" />
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      id="states-paginator"
      [pageSize]="15"
      [pageSizeOptions]="[10, 15, 20]"
      showFirstLastButtons
      aria-label="Select page of states"
    ></mat-paginator>
  </div>
}
