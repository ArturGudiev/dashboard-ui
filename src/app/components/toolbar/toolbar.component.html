<mat-toolbar color="primary">

  <button mat-button class="sidenav-toggle" (click)="toggleSidenav.emit()">
    <mat-icon>menu</mat-icon>
  </button>

  <div style="display: flex; align-items: baseline;">
    <span>ToDo Professor</span>
    <button id="task-button" mat-stroked-button (click)="onNavToClick()" >Navigate</button>
    <button id="knowledge-button" mat-stroked-button (click)="onKnowledgeClick()" >Knowledge</button>
  </div>
  <span class="example-spacer"></span>

  <div style="padding-left: 1rem">{{doneTasks}}</div>
  <button mat-button [matMenuTriggerFor]="menu">
    <mat-icon>more_vert</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
  </mat-menu>
</mat-toolbar>
