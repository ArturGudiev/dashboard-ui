@if (definitionForView(); as definition) {
  <div class="definition-value-block">{{ definition.value }}</div>
  <app-task-container-signal
    [taskContainer]="definition"
    (refreshContainer)="reloadDefinition()"
    (updateTaskContainer)="updateDefinition()"
    [showQuestions]="true"
    [showProblems]="true"
    [showStories]="true"
    [showEpics]="true"
    [showKnowledgeNodes]="true"
    [showDefinitions]="true"
    [showKnowledgeBits]="true"
  ></app-task-container-signal>
}
