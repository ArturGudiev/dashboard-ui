@if (taskForView(); as task) {
  <app-task-container-signal
    [taskContainer]="task"
    (refreshContainer)="reloadTask()"
    (updateTaskContainer)="updateTask()"
    [showQuestions]="true"
    [showProblems]="true"
    [showDefinitions]="true"
    [showKnowledgeBits]="true"
  ></app-task-container-signal>
}
