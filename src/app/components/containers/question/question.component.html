@if (questionForView(); as question) {
  <app-task-container-signal
    [taskContainer]="question"
    (refreshContainer)="reloadQuestion()"
    (updateTaskContainer)="updateQuestion()"
    [showQuestions]="true"
    [showProblems]="true"
    [showDefinitions]="true"
  ></app-task-container-signal>
}
