@if (problemForView(); as problem) {
  <app-task-container-signal
    [taskContainer]="problem"
    (refreshContainer)="reloadProblem()"
    (updateTaskContainer)="updateProblem()"
    [showQuestions]="true"
    [showProblems]="true"
    [showDefinitions]="true"
  ></app-task-container-signal>
}
