@if (showInitialLoadSpinner()) {
  <mat-spinner></mat-spinner>
} @else if (viewEpic(); as epic) {
  <app-task-container-signal
    [taskContainer]="epic"
    [parentsPath]="viewParentsPath()"
    (refreshContainer)="epicResource.reload()"
    (updateTaskContainer)="updateEpic()"
    [showEpics]="true"
    [showStories]="true"
  ></app-task-container-signal>
}
