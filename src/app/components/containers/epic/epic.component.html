@if(isLoading) {
  <mat-spinner></mat-spinner>
} @else {
  @if (!isLoading) {
    <app-task-container
      [taskContainer]="epic"
      [parentsPath]="parentsPath"
      [refreshTasks$]="refreshSubtasks$"
      [refreshProblems$]="refreshProblemsList$"
      [refreshQuestions$]="refreshQuestionsList$"
      (updateTaskContainer)="updateEpic()"
      [showEpics]="true"
      [showStories]="true"
      (refreshTaskContainer)="refreshEpic()"
    ></app-task-container>
  }
}
