@if (epicForView(); as epic) {
  <app-task-container-signal
    [taskContainer]="epic"
    (refreshContainer)="reloadEpic()"
    (updateTaskContainer)="updateEpic()"
    [showEpics]="true"
    [showStories]="true"
    [showDefinitions]="true"
    [showKnowledgeBits]="true"
  ></app-task-container-signal>
}
