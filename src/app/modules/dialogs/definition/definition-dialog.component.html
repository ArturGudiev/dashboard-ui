<h1 style="margin-bottom: 1rem" mat-dialog-title>New Definition</h1>
<form autocomplete="on" [formGroup]="myForm" (ngSubmit)="onSubmit()" >
  <mat-form-field appearance="fill" id="name-field" style="width: 20rem">
    <mat-label>Name</mat-label>
    <input id="name-input"  matInput formControlName="name">
  </mat-form-field>
  <br>
  <mat-form-field appearance="fill" id="value-field" style="width: 40rem">
    <mat-label>Value</mat-label>
    <input id="value-input" matInput formControlName="value">
  </mat-form-field>

  <div mat-dialog-actions>
    <button mat-button type="button" (click)="onNoClick()">No Thanks</button>
    <button mat-button type="submit" [disabled]="!myForm.valid">Ok</button>
  </div>
</form>
