<div id="content-wrapper" *ngIf="knowledgeNode">
  <div id="knowledge-node-content">
    <div class="flex-center-container" id="description-line">
      <app-task-container-description (goToParent)="onGoToNearestParent()"
                                      [showDoneAll]="false"
                                      [taskContainer]="knowledgeNode">
      </app-task-container-description>
    </div>
    <div>
      <app-knowledge-subnodes
            [knowledgeNodes]="subnodes"
            (refreshKnowledgeNodes)="refreshKnowledgeNodes()"
            (addKnowledgeNode)="addKnowledgeNode()">
      </app-knowledge-subnodes>
      <app-subquestions
                        (refreshQuestions)="refreshQuestions()"
                        (addQuestion)="addQuestion()"
                        (answerTheQuestion)="answerTheQuestion($event)"
                        [questions]="questions">
      </app-subquestions>
    </div>
  </div>
  <div id="right-column">
    <app-parents-path [parentsPath]="parentsPath"
                      (onParentClick)="goToParentHandler($event)">

    </app-parents-path>
    <app-subdefinitions [definitions]="definitions"
                        (addDefinition)="addDefinition()"
                        (refreshDefinitions)="refreshDefinitions()">
    </app-subdefinitions>
    <app-subactions [actions]="actions"
                    (addAction)="addAction()"
                    (refreshActions)="refreshActions()">
    </app-subactions>
    <app-subknowledge [knowledgeBits]="knowledgeBits"
                      (addKnowledge)="addKnowledge()"
                      (refreshKnowledge)="refreshKnowledgeBits()">
    </app-subknowledge>
  </div>
</div>
