<mat-spinner *ngIf="isLoading"></mat-spinner>
<ng-container *ngIf="!isLoading">
  <app-task-container
    [taskContainer]="story"
    [parentsPath]="parentsPath"
    (updateTaskContainer)="updateStory()"
    (refreshTaskContainer)="refreshStory()"
    (refreshTaskContainerTasksList)="refreshSubtasks()"
    [refreshTasks$]="refreshSubtasks$"

  >
  </app-task-container>
</ng-container>
