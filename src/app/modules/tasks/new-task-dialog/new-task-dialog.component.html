<h1>New Task</h1>

<form autocomplete="on" [formGroup]="myForm" (ngSubmit)="onSubmit()" >
  <mat-form-field appearance="fill" id="description-input">
    <mat-label>Description</mat-label>
    <input  matInput formControlName="description" autofocus>
  </mat-form-field>

  <div mat-dialog-actions>
    <button mat-button type="button" (click)="onNoClick()">No Thanks</button>
    <button mat-button type="submit" [disabled]="!myForm.valid">Ok</button>
  </div>

</form>
