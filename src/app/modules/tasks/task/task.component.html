<mat-spinner *ngIf="isLoading"></mat-spinner>
<ng-container *ngIf="!isLoading">
  <app-task-container [taskContainer]="task"
                      (onDoneAllClick)="onDoneAllClick()"
                      (goToNearestParent)="onGoToNearestParent()"
                      (updateTaskContainer)="updateTask()"
                      (resolve)="onDoneAllClick()"

  ></app-task-container>
</ng-container>
