<mat-spinner *ngIf="isLoading"></mat-spinner>
<div id="content-wrapper" *ngIf="!isLoading">
  <div id="task-content">
    <div class="flex-center-container">
      <app-task-container-description (onDoneAllClick)="onDoneAllClick()"
                                      (goToParent)="onGoToNearestParent()"
                                      [taskContainer]="task">
      </app-task-container-description>
      <button id="more-icon" [matMenuTriggerFor]="menu" mat-mini-fab color="accent" *ngIf="task?.getFullDescription()">
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #menu="matMenu">
        <button mat-menu-item (click)="addProblem()">Add a new problem</button>
        <button mat-menu-item (click)="addQuestion()">Add a new question</button>
      </mat-menu>
    </div>
    <br>
    <div>
      <app-subtasks (refreshSubtasks)="refreshSubtasks()"
                    (addSubtask)="addSubtask()"
                    (onSubtaskDoneClick)="onSubtaskDoneClick($event)"
                    [subtasks]="subtasks"></app-subtasks>

      <app-subquestions (refreshQuestions)="refreshQuestions()"
                        (addQuestion)="addQuestion()"
                        (answerTheQuestion)="answerTheQuestion($event)"
                        [questions]="questions">
      </app-subquestions>


      <app-subproblems (refreshProblems)="refreshProblems()"
                       (addProblem)="addProblem()"
                       (onProblemSolvedClick)="solveTheProblem($event)"
                       [problems]="problems">
      </app-subproblems>



    </div>
  </div>

  <div id="right-column">
    <app-parents-path [parentsPath]="parentsPath"
                      (onParentClick)="goToParentHandler($event)">

    </app-parents-path>
    <app-subdefinitions [definitions]="definitions"
                        (refreshDefinitions)="refreshDefinitions()">
    </app-subdefinitions>
  </div>
</div>


<button mat-mini-fab color="primary" (click)="onDownClick()" id="bottom-button">
  <mat-icon class="tasks-icon">south</mat-icon>
</button>
