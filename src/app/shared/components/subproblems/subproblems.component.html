<ng-container *ngIf="problems?.length > 0">

  <div id="problems-actions">
    <h2 id="problems-title" class="red-color">Problems</h2>
    <button mat-mini-fab color="primary" id="add-problem-button" (click)="addProblem.emit()">
      <mat-icon class="problems-icon">add</mat-icon>
    </button>

    <button mat-mini-fab color="primary" [disabled]="!this.selection.hasValue()"
            (click)="onFinishProblemClick()">
      <mat-icon class="problems-icon">done</mat-icon>
    </button>

  </div>

  <table id="problems-table" *ngIf="problems && problems.length > 0" mat-table
         [dataSource]="problems"
         class="mat-elevation-z8">

    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox class="red-color" [disabled]="true" (change)="$event ? masterToggle() : null"
                      [checked]="selection.hasValue() && isAllSelected()"
                      [indeterminate]="selection.hasValue() && !isAllSelected()">
        </mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let row">
        <mat-checkbox (click)="$event.stopPropagation()"
                      (change)="$event ? selection.toggle(row) : null"
                      [checked]="selection.isSelected(row)">
        </mat-checkbox>
      </td>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef> No.</th>
      <td mat-cell class="row-link red-color" (click)="onProblemClick(problem)" *matCellDef="let problem; let i = index">
        <span>{{i + 1}}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef> Description</th>
      <td mat-cell *matCellDef="let problem;" (click)="onProblemClick(problem)">
        <span class="row-link red-color"  (click)="onProblemClick(problem)">{{problem.description}}</span>
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions</th>
      <td mat-cell *matCellDef="let problem; let i=index" id="row-{{i}}">
        <mat-icon (click)="onProblemSolvedClick.emit(problem)">done</mat-icon>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

</ng-container>
