<ng-container *ngIf="knowledgeNodes?.length > 0">

  <div id="knowledge-nodes-actions">
    <h2 id="knowledge-nodes-title">Knowledge nodes</h2>
    <button mat-mini-fab color="primary" id="add-knowledge-node-button" (click)="addKnowledgeNode.emit()">
      <mat-icon class="knowledge-nodes-icon">add</mat-icon>
    </button>
  </div>
  <table id="knowledge-nodes-table" *ngIf="knowledgeNodes && knowledgeNodes.length > 0"
         mat-table
         [dataSource]="knowledgeNodes"
         class="mat-elevation-z8">

    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox [disabled]="true" (change)="$event ? masterToggle() : null"
                      [checked]="selection.hasValue() && isAllSelected()"
                      [indeterminate]="selection.hasValue() && !isAllSelected()">
        </mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let row">
        <mat-checkbox (click)="$event.stopPropagation()"
                      (change)="$event ? selection.toggle(row) : null"
                      [checked]="selection.isSelected(row)">
        </mat-checkbox>
      </td>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef> No.</th>
      <td mat-cell class="row-link" (click)="onKnowledgeNodeClick(knowledgeNode)" *matCellDef="let knowledgeNode; let i = index">
        <span>{{i + 1}}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name</th>
      <td mat-cell *matCellDef="let knowledgeNode;" (click)="onKnowledgeNodeClick(knowledgeNode)">
        <span class="row-link"  (click)="onKnowledgeNodeClick(knowledgeNode)">{{knowledgeNode.name}}</span>
      </td>
    </ng-container>


    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

</ng-container>
