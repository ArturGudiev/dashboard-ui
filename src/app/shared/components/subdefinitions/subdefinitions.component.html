<ng-container *ngIf="definitions?.length > 0">

  <div id="definitions-actions">
    <h2 id="definitions-title">Definitions</h2>
    <button mat-mini-fab color="primary" id="add-definition-button" (click)="addDefinition.emit()">
      <mat-icon class="definitions-icon">add</mat-icon>
    </button>

  </div>

  <table id="definitions-table" *ngIf="definitions && definitions.length > 0" mat-table
         [dataSource]="definitions"
         class="mat-elevation-z8">

    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox [disabled]="true" (change)="$event ? onMainCheckboxClick() : null"
                      [checked]="selection.hasValue() && isAllSelected()"
                      [indeterminate]="selection.hasValue() && !isAllSelected()">
        </mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let row">
        <mat-checkbox (click)="$event.stopPropagation()"
                      (change)="$event ? selection.toggle(row) : null"
                      [checked]="selection.isSelected(row)">
        </mat-checkbox>
      </td>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef> No.</th>
      <td mat-cell class="row-link" (click)="onDefinitionClick(definition)" *matCellDef="let definition; let i = index">
        <span>{{i + 1}}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name</th>
      <td mat-cell *matCellDef="let definition;" (click)="onDefinitionClick(definition)">
        <span class="row-link"  (click)="onDefinitionClick(definition)">{{definition.name}}</span>
      </td>
    </ng-container>

    <!-- Values Column -->
    <ng-container matColumnDef="value">
      <th mat-header-cell *matHeaderCellDef> Values</th>
      <td mat-cell *matCellDef="let definition;" (click)="onDefinitionClick(definition)">
        <span class="row-link"  (click)="onDefinitionClick(definition)">{{definition.value}}</span>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

</ng-container>
