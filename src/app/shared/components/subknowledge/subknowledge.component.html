<ng-container *ngIf="knowledgeBits?.length > 0">

  <div id="knowledge-bits-root">
    <h2 id="knowledge-bits-title">Knowledge</h2>
    <button mat-mini-fab color="primary" id="add-knowledge-button" (click)="addKnowledge.emit()">
      <mat-icon class="knowledge-add-icon">add</mat-icon>
    </button>

  </div>

  <table id="knowledge-bits-table" *ngIf="knowledgeBits && knowledgeBits.length > 0" mat-table
         [dataSource]="knowledgeBits"
         class="mat-elevation-z8">

    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox [disabled]="true" (change)="$event ? onMainCheckboxClick() : null"
                      [checked]="selection.hasValue() && isAllSelected()"
                      [indeterminate]="selection.hasValue() && !isAllSelected()">
        </mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let row">
        <mat-checkbox (click)="$event.stopPropagation()"
                      (change)="$event ? selection.toggle(row) : null"
                      [checked]="selection.isSelected(row)">
        </mat-checkbox>
      </td>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef> No.</th>
      <td mat-cell class="row-link" (click)="onKnowledgeClick(knowledge)" *matCellDef="let knowledge; let i = index">
        <span>{{i + 1}}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name</th>
      <td mat-cell *matCellDef="let knowledge;" (click)="onKnowledgeClick(knowledge)">
        <span class="row-link"  (click)="onKnowledgeClick(knowledge)">{{knowledge.name}}</span>
      </td>
    </ng-container>

    <!-- Values Column -->
    <ng-container matColumnDef="value">
      <th mat-header-cell *matHeaderCellDef> Values</th>
      <td mat-cell *matCellDef="let knowledge;" (click)="onKnowledgeClick(knowledge)">
        <span class="row-link"  (click)="onKnowledgeClick(knowledge)">
          {{knowledge.value.split('\n')[0].slice(0, 60)}}{{knowledge.value.split('\n').length > 1 ? '...' : ''}}
        </span>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

</ng-container>
