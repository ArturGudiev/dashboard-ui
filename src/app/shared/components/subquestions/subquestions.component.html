<ng-container *ngIf="questions.length > 0">

  <div id="questions-actions">
    <h2 id="questions-title" class="vegas-color">Questions</h2>
    <button mat-mini-fab color="primary" id="add-question-button" (click)="addQuestion.emit()">
      <mat-icon class="questions-icon">add</mat-icon>
    </button>

    <button mat-mini-fab color="primary" [disabled]="!this.selection.hasValue()"
            (click)="onAnswerQuestionClick()">
      <mat-icon class="questions-icon">done</mat-icon>
    </button>

  </div>

  <table id="questions-table" *ngIf="questions && questions.length > 0" mat-table
         [dataSource]="questions"
         class="mat-elevation-z8">

    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox class="vegas-color" [disabled]="true" (change)="$event ? onMainCheckboxClick() : null"
                      [checked]="selection.hasValue() && isAllSelected()"
                      [indeterminate]="selection.hasValue() && !isAllSelected()">
        </mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let row">
        <mat-checkbox (click)="$event.stopPropagation()"
                      (change)="$event ? selection.toggle(row) : null"
                      [checked]="selection.isSelected(row)">
        </mat-checkbox>
      </td>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef> No.</th>
      <td mat-cell class="row-link vegas-color" (click)="onQuestionClick(question)" *matCellDef="let question; let i = index">
        <span>{{i + 1}}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef> Description</th>
      <td mat-cell *matCellDef="let question;" (click)="onQuestionClick(question)">
        <span class="row-link vegas-color"  (click)="onQuestionClick(question)">{{question.description}}</span>
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions</th>
      <td mat-cell *matCellDef="let question; let i=index" id="row-{{i}}">
        <mat-icon (click)="answerTheQuestion.emit(question)">done</mat-icon>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

</ng-container>
